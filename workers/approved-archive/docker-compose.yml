services:
  approved-archive-worker:
    build:
      context: ../..
      dockerfile: workers/approved-archive/Dockerfile
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2500}
